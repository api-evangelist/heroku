naftiko: 1.0.0-alpha2
info:
  label: Heroku Platform API — Log Sessions
  description: 'Heroku Platform API — Log Sessions. 1 operations. Lead operation: Create a log session. Self-contained Naftiko
    capability covering one Heroku business surface.'
  tags:
  - Heroku
  - Log Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HEROKU_API_KEY: HEROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-log-sessions
    baseUri: https://api.heroku.com
    description: Heroku Platform API — Log Sessions business capability. Self-contained, no shared references.
    resources:
    - name: apps-app_id_or_name-log-sessions
      path: /apps/{app_id_or_name}/log-sessions
      operations:
      - name: createlogsession
        method: POST
        description: Create a log session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.HEROKU_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-log-sessions-rest
    port: 8080
    description: REST adapter for Heroku Platform API — Log Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apps/{app-id-or-name}/log-sessions
      name: apps-app-id-or-name-log-sessions
      description: REST surface for apps-app_id_or_name-log-sessions.
      operations:
      - method: POST
        name: createlogsession
        description: Create a log session
        call: platform-log-sessions.createlogsession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-log-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Heroku Platform API — Log Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-log-session
      description: Create a log session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-log-sessions.createlogsession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
