naftiko: 1.0.0-alpha2
info:
  label: Heroku Platform API — Account
  description: 'Heroku Platform API — Account. 2 operations. Lead operation: Get account info. Self-contained Naftiko capability
    covering one Heroku business surface.'
  tags:
  - Heroku
  - Account
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HEROKU_API_KEY: HEROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-account
    baseUri: https://api.heroku.com
    description: Heroku Platform API — Account business capability. Self-contained, no shared references.
    resources:
    - name: account
      path: /account
      operations:
      - name: getaccount
        method: GET
        description: Get account info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateaccount
        method: PATCH
        description: Update account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.HEROKU_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-account-rest
    port: 8080
    description: REST adapter for Heroku Platform API — Account. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/account
      name: account
      description: REST surface for account.
      operations:
      - method: GET
        name: getaccount
        description: Get account info
        call: platform-account.getaccount
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateaccount
        description: Update account
        call: platform-account.updateaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-account-mcp
    port: 9090
    transport: http
    description: MCP adapter for Heroku Platform API — Account. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-account-info
      description: Get account info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-account.getaccount
      outputParameters:
      - type: object
        mapping: $.
    - name: update-account
      description: Update account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: platform-account.updateaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
