naftiko: 1.0.0-alpha2
info:
  label: Heroku Platform API — Add-ons
  description: 'Heroku Platform API — Add-ons. 4 operations. Lead operation: List add-ons for an app. Self-contained Naftiko
    capability covering one Heroku business surface.'
  tags:
  - Heroku
  - Add-ons
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HEROKU_API_KEY: HEROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-add-ons
    baseUri: https://api.heroku.com
    description: Heroku Platform API — Add-ons business capability. Self-contained, no shared references.
    resources:
    - name: apps-app_id_or_name-addons
      path: /apps/{app_id_or_name}/addons
      operations:
      - name: listaddons
        method: GET
        description: List add-ons for an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createaddon
        method: POST
        description: Create an add-on
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apps-app_id_or_name-addons-addon_id_or_name
      path: /apps/{app_id_or_name}/addons/{addon_id_or_name}
      operations:
      - name: getaddon
        method: GET
        description: Get add-on info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: addon_id_or_name
          in: path
          type: string
          required: true
      - name: deleteaddon
        method: DELETE
        description: Delete an add-on
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: addon_id_or_name
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.HEROKU_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-add-ons-rest
    port: 8080
    description: REST adapter for Heroku Platform API — Add-ons. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apps/{app-id-or-name}/addons
      name: apps-app-id-or-name-addons
      description: REST surface for apps-app_id_or_name-addons.
      operations:
      - method: GET
        name: listaddons
        description: List add-ons for an app
        call: platform-add-ons.listaddons
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createaddon
        description: Create an add-on
        call: platform-add-ons.createaddon
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{app-id-or-name}/addons/{addon-id-or-name}
      name: apps-app-id-or-name-addons-addon-id-or-name
      description: REST surface for apps-app_id_or_name-addons-addon_id_or_name.
      operations:
      - method: GET
        name: getaddon
        description: Get add-on info
        call: platform-add-ons.getaddon
        with:
          addon_id_or_name: rest.addon_id_or_name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteaddon
        description: Delete an add-on
        call: platform-add-ons.deleteaddon
        with:
          addon_id_or_name: rest.addon_id_or_name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-add-ons-mcp
    port: 9090
    transport: http
    description: MCP adapter for Heroku Platform API — Add-ons. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-add-ons-app
      description: List add-ons for an app
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-add-ons.listaddons
      outputParameters:
      - type: object
        mapping: $.
    - name: create-add
      description: Create an add-on
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-add-ons.createaddon
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-add-info
      description: Get add-on info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-add-ons.getaddon
      with:
        addon_id_or_name: tools.addon_id_or_name
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-add
      description: Delete an add-on
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: platform-add-ons.deleteaddon
      with:
        addon_id_or_name: tools.addon_id_or_name
      outputParameters:
      - type: object
        mapping: $.
