naftiko: 1.0.0-alpha2
info:
  label: Heroku Platform API — Releases
  description: 'Heroku Platform API — Releases. 3 operations. Lead operation: List releases. Self-contained Naftiko capability
    covering one Heroku business surface.'
  tags:
  - Heroku
  - Releases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HEROKU_API_KEY: HEROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-releases
    baseUri: https://api.heroku.com
    description: Heroku Platform API — Releases business capability. Self-contained, no shared references.
    resources:
    - name: apps-app_id_or_name-releases
      path: /apps/{app_id_or_name}/releases
      operations:
      - name: listreleases
        method: GET
        description: List releases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createrelease
        method: POST
        description: Create a release (rollback)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apps-app_id_or_name-releases-release_id_or_version
      path: /apps/{app_id_or_name}/releases/{release_id_or_version}
      operations:
      - name: getrelease
        method: GET
        description: Get release info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: release_id_or_version
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.HEROKU_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-releases-rest
    port: 8080
    description: REST adapter for Heroku Platform API — Releases. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apps/{app-id-or-name}/releases
      name: apps-app-id-or-name-releases
      description: REST surface for apps-app_id_or_name-releases.
      operations:
      - method: GET
        name: listreleases
        description: List releases
        call: platform-releases.listreleases
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createrelease
        description: Create a release (rollback)
        call: platform-releases.createrelease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{app-id-or-name}/releases/{release-id-or-version}
      name: apps-app-id-or-name-releases-release-id-or-version
      description: REST surface for apps-app_id_or_name-releases-release_id_or_version.
      operations:
      - method: GET
        name: getrelease
        description: Get release info
        call: platform-releases.getrelease
        with:
          release_id_or_version: rest.release_id_or_version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-releases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Heroku Platform API — Releases. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-releases
      description: List releases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-releases.listreleases
      outputParameters:
      - type: object
        mapping: $.
    - name: create-release-rollback
      description: Create a release (rollback)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-releases.createrelease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-release-info
      description: Get release info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-releases.getrelease
      with:
        release_id_or_version: tools.release_id_or_version
      outputParameters:
      - type: object
        mapping: $.
