naftiko: 1.0.0-alpha2
info:
  label: Heroku Platform API — Apps
  description: 'Heroku Platform API — Apps. 5 operations. Lead operation: List apps. Self-contained Naftiko capability covering
    one Heroku business surface.'
  tags:
  - Heroku
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HEROKU_API_KEY: HEROKU_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-apps
    baseUri: https://api.heroku.com
    description: Heroku Platform API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: apps
      path: /apps
      operations:
      - name: listapps
        method: GET
        description: List apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapp
        method: POST
        description: Create an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: apps-app_id_or_name
      path: /apps/{app_id_or_name}
      operations:
      - name: getapp
        method: GET
        description: Get app info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapp
        method: PATCH
        description: Update an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deleteapp
        method: DELETE
        description: Delete an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.HEROKU_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-apps-rest
    port: 8080
    description: REST adapter for Heroku Platform API — Apps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apps
      name: apps
      description: REST surface for apps.
      operations:
      - method: GET
        name: listapps
        description: List apps
        call: platform-apps.listapps
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapp
        description: Create an app
        call: platform-apps.createapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{app-id-or-name}
      name: apps-app-id-or-name
      description: REST surface for apps-app_id_or_name.
      operations:
      - method: GET
        name: getapp
        description: Get app info
        call: platform-apps.getapp
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateapp
        description: Update an app
        call: platform-apps.updateapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapp
        description: Delete an app
        call: platform-apps.deleteapp
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Heroku Platform API — Apps. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-apps
      description: List apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-apps.listapps
      outputParameters:
      - type: object
        mapping: $.
    - name: create-app
      description: Create an app
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-apps.createapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-app-info
      description: Get app info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-apps.getapp
      outputParameters:
      - type: object
        mapping: $.
    - name: update-app
      description: Update an app
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: platform-apps.updateapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-app
      description: Delete an app
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: platform-apps.deleteapp
      outputParameters:
      - type: object
        mapping: $.
