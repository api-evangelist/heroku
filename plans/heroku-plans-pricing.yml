      - label: Monthly base
        name: monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '5.00'
        userMultiplied: false
    elements:
      - name: Sleeps after 30min idle
      - name: 1,000 dyno-hours/mo pool
