  createRelease(appId: String!, slug: UUID!, description: String): Release!
  rollbackRelease(appId: String!, releaseId: UUID!): Release!

  # Domain
  addDomain(appId: String!, hostname: String!): Domain!
  deleteDomain(appId: String!, domainId: UUID!): Domain!

  # Collaborator
  addCollaborator(appId: String!, email: String!, silent: Boolean): Collaborator!
  removeCollaborator(appId: String!, collaboratorId: UUID!): Collaborator!

  # Log Drain
  createLogDrain(appId: String!, url: String!): LogDrain!
  deleteLogDrain(appId: String!, logDrainId: UUID!): LogDrain!

  # Addon
  provisionAddon(appId: String!, plan: String!, name: String, config: JSON): Addon!
  updateAddon(appId: String!, addonId: String!, plan: String!): Addon!
  deprovisionAddon(appId: String!, addonId: String!): Addon!

  # Pipeline
  createPipeline(name: String!): Pipeline!
  deletePipeline(id: UUID!): Pipeline!
  coupleAppToPipeline(pipelineId: UUID!, appId: String!, stage: PipelineStage!): PipelineCoupling!
  uncoupleAppFromPipeline(id: UUID!): PipelineCoupling!
  promotePipeline(pipelineId: UUID!, sourceAppId: String!, targetAppIds: [String!]!): PipelinePromotion!

  # Space
  createSpace(name: String!, team: String!, region: String, shield: Boolean): Space!
  deleteSpace(id: String!): Space!

  # Team
  createTeam(name: String!, credit_card_collections: Boolean): Team!
  deleteTeam(id: String!): Team!
  addTeamMember(teamId: String!, email: String!, role: TeamRole!): TeamMember!
  removeTeamMember(teamId: String!, email: String!): TeamMember!

  # Webhook
  createWebhook(appId: String!, url: String!, include: [String!]!, level: WebhookLevel!, secret: String, authorization: String): Webhook!
  updateWebhook(appId: String!, webhookId: UUID!, url: String, include: [String!], level: WebhookLevel, secret: String, authorization: String): Webhook!
  deleteWebhook(appId: String!, webhookId: UUID!): Webhook!

  # OAuth
  createOAuthClient(name: String!, redirect_uri: String!): OAuthClient!
  updateOAuthClient(id: UUID!, name: String, redirect_uri: String): OAuthClient!
  deleteOAuthClient(id: UUID!): OAuthClient!
  rotateOAuthClientSecret(id: UUID!): OAuthClient!

  # SNI
  createSniEndpoint(appId: String!, certificate_chain: String!, private_key: String!): SNI!
  updateSniEndpoint(appId: String!, sniId: UUID!, certificate_chain: String!, private_key: String!): SNI!
  deleteSniEndpoint(appId: String!, sniId: UUID!): SNI!

  # Key
  addKey(public_key: String!): Key!
  deleteKey(id: UUID!): Key!

  # Buildpack
  updateBuildpackInstallations(appId: String!, updates: [BuildpackUpdate!]!): [BuildpackInstallation!]!

  # Review App
  createReviewApp(pipelineId: UUID!, branch: String!, pr_number: Int, source_blob: JSON!): ReviewApp!
  deleteReviewApp(id: UUID!): ReviewApp!
  updateReviewAppConfig(pipelineId: UUID!, automatic_review_apps: Boolean, destroy_stale_apps: Boolean, stale_days: Int, wait_for_ci: Boolean): ReviewAppConfig!

  # OutboundRuleset
  updateOutboundRuleset(spaceId: String!, rules: [OutboundRuleInput!]!): OutboundRuleset!
}

