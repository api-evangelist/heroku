aid: heroku
name: Heroku
description: >-
  Heroku is a cloud platform as a service (PaaS) that enables developers to
  build, run, and operate applications entirely in the cloud. The Heroku
  Platform API enables programmatic access to Heroku's features for app
  deployment, scaling, and management.
